name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Test Executable
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./build/bin/Release/dnpacker.exe --help
        else
          ./build/bin/dnpacker --help
        fi
